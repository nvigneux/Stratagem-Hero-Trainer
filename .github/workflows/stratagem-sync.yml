name: Propose new stratagem icons
on:
  repository_dispatch:
    types: [stratagem-icons-updated]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
concurrency:
  group: stratagem-icons
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Leave an existing icon PR for review
        id: pending
        run: |
          count=$(gh pr list --state open --limit 1000 --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/stratagem-icons-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then echo 'An icon PR is already open; new icons will wait for the next sync.'; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.pending.outputs.count == '0'
        with:
          ref: master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.pending.outputs.count == '0'
        with:
          repository: nvigneux/Helldivers-2-Stratagems-icons-svg
          ref: master
          path: _icon-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.pending.outputs.count == '0'
        with:
          python-version: '3.12'
      - name: Copy missing SVGs and open a PR
        if: steps.pending.outputs.count == '0'
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/stratagem-icons-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/sync-icons.py --source _icon-source --branch "$branch" --report "$RUNNER_TEMP/icon-pr.md"
          git add public/icons/stratagems
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m 'Add new upstream stratagem icons'
          git push origin "$branch"
          gh pr create --base master --head "$branch" --title 'Add new stratagem icons' --body-file "$RUNNER_TEMP/icon-pr.md"
